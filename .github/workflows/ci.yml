name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # DataSquared has to keep working on both, so every change is built and tested on both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test core
        run: dotnet test tests/DataSquared.Core.Tests
      - name: Build app
        run: dotnet build app/DataSquared.csproj
