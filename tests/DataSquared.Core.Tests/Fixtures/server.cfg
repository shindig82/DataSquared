; FLEETBORNE dedicated server settings.
;
; Change a value, save, and restart the server. Lines starting with ; or # are
; comments, and quotes around text are optional. Anything given on the server's
; command line, such as --port=9001, overrides what is set here. An admin can
; change these while the server runs, with set in the console. That is written
; here as well, and a setting that needs a restart takes effect when the server
; next starts.

[server]

; The server's name, told to each player as they join.
name = 

; Shown to each player in chat when they join. Leave empty for none.
welcome = 

; Players must give this to join. Leave empty to let anyone in.
password = 

; Makes a pilot an admin, given in place of the join password or with the admin command in the console. Leave empty for no admins.
admin_password = 

; The most pilots in the arena at once, from 1 to 64.
max_players = 16

[network]

; The UDP port players connect to.
port = 9000

[match]

; The star system the match is flown in, by id, such as core:system_kepler. The systems command lists the ones installed.
system = core:system_arena

; Ships the server flies itself, from 0 to 64.
ai_count = 0

; The hull those ships fly, by id, such as core:hull_light_corvette. Leave empty for the default fighter.
ai_hull = 

; Teams arriving pilots are split between, up to 6. 0 or 1 is a free-for-all.
teams = 0

; Whether pilots on the same team can hurt each other.
friendly_fire = false

; Whether a destroyed ship's cargo drops into its wreck along with its fitted parts. When it does, each new ship tops the hold back up to what its hull starts with.
drop_hold = false

; The most mines one pilot can have laid at once, from 1 to 64. Laying another takes up their oldest.
max_mines = 12

; How long, in seconds, the server keeps a pilot's holdings, team and ship when their connection is lost, for them to come back to. 0 keeps nothing.
reconnect_seconds = 120

[network]

; Send each player everyone else's ships as one packet a tick, by what they can see, rather than every ship to everyone. Off is the old way, for comparison.
ship_snapshots = true

; The most ticks a pilot's input is stamped ahead, each pilot's game choosing from its own ping, so the server rarely simulates a tick twice: 0 on a LAN, 2 or 3 over the internet. Each tick is 33 ms more before a pilot's own ship answers their keys. 0 turns it off. Told to pilots as they join.
input_delay_max = 3

; How far back, in milliseconds, the server tests a pilot's shot: against ships where the pilot's own game showed them, so a hit they saw lands. Fair to slow connections; a target is now and then hit just after reaching cover. 0 tests ships where they stand.
lag_compensation_ms = 200

; How far past what a pilot can see the server sends them ships, as a multiple of it: 1.5 sends them half as far again, so ships are already moving when they come into sight. From 1 to 4.
aoi_range = 1.5

[logging]

; Log every ship's state once a second. For debugging, and noisy.
log_state = false

[steam]

; List this server on Steam's server browser, so pilots can find it. Open the query port as well as the game port.
list = false

; Check the Steam account of each pilot who offers one, so a ban can follow the account and not only the address. Pilots without Steam still join. A listed server does this too.
auth = false

; The UDP port Steam's server browser asks this server about itself on.
query_port = 27016
